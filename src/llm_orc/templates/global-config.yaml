# Global configuration for LLM Orchestra
# This file provides default model profiles available across all projects

# Model profiles define complete agent configurations. None ship here: a
# profile names a model on a provider you have set up, so add your own.
# Each profile includes: model, provider, system_prompt, timeout_seconds, cost_per_token,
# and optional generation parameters (temperature, max_tokens)
#
# model_profiles:
#   my-profile:
#     model: <model-name>
#     provider: <anthropic-api | google-gemini | openai-compatible | llama-server>
#     system_prompt: You are a helpful analyst.
#     timeout_seconds: 60
model_profiles: {}

# Performance configuration with sensible defaults
performance:
  # Resource management settings
  concurrency:
    # Maximum concurrent agents (0 = unlimited, uses smart defaults)
    max_concurrent_agents: 0
    # Connection pooling settings
    connection_pool:
      max_connections: 100
      max_keepalive: 20
      keepalive_expiry: 30
    
  # Execution settings
  execution:
    # Default timeout for agent execution (seconds)
    default_timeout: 60
    # Performance monitoring hooks enabled
    monitoring_enabled: true
    # Streaming execution enabled by default
    streaming_enabled: true
    
  # Memory management
  memory:
    # Memory-efficient mode (reduces memory usage at slight performance cost)
    efficient_mode: false
    # Maximum memory usage threshold (MB, 0 = unlimited)
    max_memory_mb: 0