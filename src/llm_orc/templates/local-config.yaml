# Local project configuration for {project_name}
# This file configures project-specific settings and model profiles

project:
  name: "{project_name}"

# Model profiles define complete agent configurations. None ship here: a
# profile names a model on a provider you have set up, so add your own.
# Each profile includes: model, provider, system_prompt, timeout_seconds, cost_per_token,
# and optional generation parameters (temperature, max_tokens)
#
# model_profiles:
#   my-profile:
#     model: <model-name>
#     provider: <anthropic-api | google-gemini | openai-compatible | llama-server>
#     system_prompt: You are a helpful analyst.
#     timeout_seconds: 60
model_profiles: {}
